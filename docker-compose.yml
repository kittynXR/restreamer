name: relay

services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    container_name: relay-mediamtx
    restart: unless-stopped
    depends_on:
      router:
        condition: service_healthy
    ports:
      - "${SRT_PORT:-8890}:8890/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - relay_data:/relay-data:ro
    networks:
      - relay_internal
      - relay_edge

  router:
    build: ./router
    container_name: relay-router
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/relay.db
      MEDIAMTX_API: http://mediamtx:9997
      MEDIAMTX_HLS: http://mediamtx:8888
      MEDIAMTX_RTSP: mediamtx:8554
      PUBLIC_HOST: ${PUBLIC_HOST:-relay.example.com}
      SRT_PORT: "${SRT_PORT:-8890}"
    volumes:
      - relay_data:/data
    ports:
      - "127.0.0.1:8787:8787"
    networks:
      - relay_internal
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  site:
    build: ./site
    container_name: relay-site
    restart: unless-stopped
    networks:
      - proxy

volumes:
  relay_data:

networks:
  relay_internal:
    internal: true
  relay_edge:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-caddy}
