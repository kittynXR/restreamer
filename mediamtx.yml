logLevel: info
logDestinations: [stdout]
# Also the SRT peer-idle timeout, so this is how long a vanished OBS publisher
# stays "connected" before the failover file takes over — and MediaMTX adds that
# whole dead interval to the first slate frame's timestamp, so viewers see it as
# a freeze of the same length. Keep it comfortably above the negotiated SRT
# latency (500 ms in the generated OBS URL) plus retransmission bursts; below
# about 1.5 s a lossy uplink starts getting dropped mid-broadcast.
#
# It also bounds the /internal/mediamtx-auth call to the router, so it must stay
# above the router's worst-case response time or a publish gets rejected outright
# — which is why this is 3s rather than the 2s the failover budget alone wants.
# Per-stream "fast handoff" is the safer lever for cutting detection further.
readTimeout: 3s
writeTimeout: 10s

authMethod: http
authHTTPAddress: http://router:8787/internal/mediamtx-auth
authHTTPExclude:
  - action: api

api: true
apiAddress: :9997

rtsp: true
rtspAddress: :8554
rtmp: false
hls: true
hlsAddress: :8888
hlsVariant: lowLatency
hlsAlwaysRemux: false
webrtc: false
srt: true
srtAddress: :8890

# Two paths per stream. OBS publishes to the bare slug (the ingest); the
# forwarders and the monitor read <slug>/program, which the router feeds from
# the ingest with an internal copy while live input is on air and which falls
# back to active.mp4 whenever that copy is stopped. That split is what lets OBS
# stay connected while Starting Soon or BRB is on air. The router creates both
# paths for every other stream through the API; "studio" is static because its
# always-available file must resolve at config load.
paths:
  studio:
    source: publisher
    overridePublisher: true
  studio/program:
    source: publisher
    overridePublisher: true
    alwaysAvailable: true
    alwaysAvailableFile: /relay-data/media/studio/active.mp4
